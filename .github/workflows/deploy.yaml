name: Deploy SentinelFlow Backend

on:
  push:
    branches:
      - main
      - backend
    paths:
      - 'backend/**'

env:
  AWS_REGION: us-east-1
  SAM_STACK_NAME: sentinelflow-backend-prod

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install boto3

      - name: Run Unit Tests
        run: |
          python scripts/test_auth.py
          python scripts/test_search.py
          python scripts/test_analyze.py
          python scripts/test_eventbridge.py
          python scripts/test_workflow.py
          python scripts/test_cedar.py
          python scripts/test_audit.py

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
